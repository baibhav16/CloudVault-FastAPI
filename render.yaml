databases:
  - name: cloudvault-db
    databaseName: cloudvault
    user: cloudvault
    plan: free

services:
  - type: web
    name: cloudvault-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_MODE
        value: local
      - key: CORS_ORIGINS
        value: '["http://localhost:5173"]'
